[workspace]
authors = ["Yohsuke Fukai <ysk@yfukai.net>"]
channels = ["conda-forge"]
name = "stitching"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
networkx = ">=3.6.1,<4"
numpy = ">=2.4.1,<3"
pandas = ">=2.0,<3.0"
zarr = ">=3.1.5,<4"
tensorstore = ">=0.1.65,<0.2"
matplotlib = ">=3.10.8,<4"
dask = ">=2026.1.1,<2027"
pyyaml = ">=6.0.3,<7"
ipykernel = ">=7.1.0,<8"
joblib = ">=1.5.3,<2"

[pypi-dependencies]
pyrallis = ">=0.3.1, <0.4"
m2stitch = ">=0.7.2, <0.8"
