[workspace]
authors = ["Yohsuke Fukai <ysk@yfukai.net>"]
channels = ["conda-forge"]
name = "correct_shading"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
bioio = ">=3.2.0,<4"
ipykernel = ">=7.1.0,<8"
matplotlib = ">=3.10.8,<4"
scyjava = ">=1.12.1,<2"
pybaselines = ">=1.2.1,<2"
tensorstore = ">=0.1.65,<0.2"

[pypi-dependencies]
pyrallis = ">=0.3.1, <0.4"
bioio-czi = ">=2.4.2, <3"
bioio-dv = ">=1.2.0, <2"
bioio-imageio = ">=1.3.0, <2"
bioio-lif = ">=1.4.1, <2"
bioio-nd2 = ">=1.5.0, <2"
bioio-ome-tiff = ">=1.4.0, <2"
bioio-ome-zarr = ">=3.2.1, <4"
bioio-tifffile = ">=1.3.0, <2"
bioio-bioformats = ">=1.3.2, <2"
